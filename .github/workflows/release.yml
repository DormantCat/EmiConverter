# Автосборка и публикация релиза.
#
# Релиз создаётся двумя способами:
#   1. Отправить тег вида v1.0.12 (должен совпадать с <Version> в EmiConverter.csproj).
#   2. Actions → Release → Run workflow с включённой галочкой «Опубликовать релиз».
#      Тег v<Version> создаётся автоматически на текущем коммите.
# При ручном запуске без галочки файлы только собираются и лежат в разделе Artifacts.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Опубликовать релиз (тег v<Version> из EmiConverter.csproj)'
        type: boolean
        default: true

permissions:
  contents: read

# Версия SDK задана в global.json (9.0.200). Без него на раннерах GitHub
# берётся самый новый SDK, а не 9.0.200. 9.0.200 собирает EXE с .NET 9.0.2,
# как описано в SECURITY-REVIEW.md, с тем же SHA-256, что у локальной сборки.
# Если сменить SDK, изменятся версия .NET внутри EXE и хеш: обновите SECURITY-REVIEW.md.
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Версия из EmiConverter.csproj
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = ([xml](Get-Content EmiConverter.csproj)).Project.PropertyGroup.Version
          if ($env:REF_TYPE -eq 'tag' -and "v$version" -ne $env:TAG) {
            Write-Error "Тег $env:TAG не совпадает с версией $version в EmiConverter.csproj."
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Версия: $version"

      - name: Сборка
        run: |
          dotnet --version
          dotnet msbuild build.proj -p:Platform=windows

      - name: Подготовить файл
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist/windows-x64/EmiConverter.exe out/EmiConverter-windows-x64.exe
          (Get-FileHash out/EmiConverter-windows-x64.exe -Algorithm SHA256).Hash

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: out/EmiConverter-windows-x64.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Сборка
        run: |
          dotnet --version
          dotnet msbuild build.proj -p:Platform=linux

      - name: Упаковать каталог
        run: |
          mkdir -p out
          tar -czf out/EmiConverter-linux-x64.tar.gz -C dist linux-x64

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: out/EmiConverter-linux-x64.tar.gz
          if-no-files-found: error

  release:
    # Linux-сборка пока не проверена на реальной системе. Если она упадёт,
    # релиз всё равно выйдет с Windows-файлом, а в описании будет пометка.
    needs: [windows, linux]
    if: >-
      !cancelled() && needs.windows.result == 'success' &&
      (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Контрольные суммы
        working-directory: assets
        run: sha256sum * | tee SHA256SUMS.txt

      - name: Создать релиз
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.windows.outputs.version }}
          LINUX_RESULT: ${{ needs.linux.result }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Релиз $TAG уже существует. Поднимите <Version> в EmiConverter.csproj или удалите старый релиз."
            exit 1
          fi
          {
            echo "Автоматическая сборка версии $VERSION."
            echo
            echo "- EmiConverter-windows-x64.exe — Windows 10/11 x64, один файл, установка .NET не нужна."
            if [ "$LINUX_RESULT" = "success" ]; then
              echo "- EmiConverter-linux-x64.tar.gz — Linux x64: распаковать каталог целиком и запустить ./EmiConverter. Запуск под Linux не проверялся."
            else
              echo "- Сборка Linux не удалась, в этом релизе её нет."
            fi
            echo "- SHA256SUMS.txt — контрольные суммы файлов."
          } > notes.md
          # --target нужен при ручном запуске: тег создаётся на собранном коммите.
          gh release create "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "EMI Converter $VERSION" --notes-file notes.md
